services:
  lara2-web:
    build: .
    container_name: lara2_web
    restart: unless-stopped
    ports:
      - "8485:80"
      - "8446:443"
    volumes:
      - .:/var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      lara2-mysql:
        condition: service_healthy
      lara2-postgres:
        condition: service_healthy
      lara2-redis:
        condition: service_started

  lara2-mysql:
    image: mysql:8.0
    container_name: lara2_mysql
    restart: unless-stopped
    ports:
      - "3386:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lara2
      MYSQL_USER: lara2
      MYSQL_PASSWORD: lara2
    volumes:
      - lara2_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  lara2-postgres:
    image: pgvector/pgvector:pg16
    container_name: lara2_postgres
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: lara2_vectors
      POSTGRES_USER: lara2
      POSTGRES_PASSWORD: lara2
    volumes:
      - lara2_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lara2 -d lara2_vectors"]
      interval: 5s
      timeout: 5s
      retries: 20

  lara2-redis:
    image: redis:7.2-alpine
    container_name: lara2_redis
    restart: unless-stopped
    # без проброса порта на хост — внутри docker-сети достаточно lara2-redis:6379

  lara2-pma:
    image: phpmyadmin/phpmyadmin
    container_name: lara2_pma
    restart: unless-stopped
    ports:
      - "8303:80"
    environment:
      PMA_HOST: lara2-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    depends_on:
      - lara2-mysql

  lara2-pgadmin:
    image: dpage/pgadmin4:8
    container_name: lara2_pgadmin
    restart: unless-stopped
    ports:
      - "8304:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - lara2_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - lara2-postgres

volumes:
  lara2_mysql_data:
  lara2_postgres_data:
  lara2_pgadmin_data:
